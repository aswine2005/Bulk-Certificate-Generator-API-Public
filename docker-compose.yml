# API + PostgreSQL. Start with:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certs
      POSTGRES_PASSWORD: certs
      POSTGRES_DB: certs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certs -d certs"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://certs:certs@db:5432/certs
      STORAGE_DIR: /srv/data/certificates
      PUBLIC_BASE_URL: http://localhost:8000
      WORKER_THREADS: 2
    volumes:
      - certificates:/srv/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  certificates:
